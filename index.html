      const v = $('#ip').value.trim();
      if (v.length < 3){ $('#ierr').textContent = 'Choisis un pseudo d’au moins 3 caractères.'; return; }
      store.set(LS.profile, {id:'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), pseudo:v.slice(0, 16), color});
      showSaved();
      pushPresence({m:g.mode.id, d:g.dk, sc:total, r:ri});
    });
  }
}

function confetti(main){
  if (REDUCED) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const cols = [main, '#ff5b3a', '#f6c453', '#e9ddc3', '#2fd08a', '#7fd8ff'];
  const P = Array.from({length:160}, () => ({x:c.width * (.2 + Math.random() * .6), y:c.height * .35, vx:(Math.random() - .5) * 22 * dpr, vy:(-Math.random() * 18 - 6) * dpr, s:(4 + Math.random() * 6) * dpr, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
  const step = now => {
    const t = now - t0; ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .5 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 3200); ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (t < 3200) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

/* =====================================================================
   Classement
   ===================================================================== */
let BOARD_TAB = 'general';
function boardSource(){
  if (DB.status === 'live') return {players:DB.players, me:DB.uid, shared:true};
  const p = getProfile();
  return {players:localPlayers(), me:p ? p.id : null, shared:false};
}
function boardRows(tab){
  const {players, me} = boardSource();
  const rows = [];
  players.forEach((p, id) => {
    if (tab === 'general'){
      const bs = Object.values(p.best); if (!bs.length) return;
      rows.push({id, me:id === me, pseudo:p.pseudo, color:p.color, score:bs.reduce((a, b) => a + b.score, 0), ri:Math.max(...bs.map(b => rankIdx(b.score))), sub:bs.length + ' mode' + (bs.length > 1 ? 's' : ''), at:Math.max(...bs.map(b => b.at))});
    } else {
      const b = p.best[tab]; if (!b) return;
      rows.push({id, me:id === me, pseudo:p.pseudo, color:p.color, score:b.score, ri:rankIdx(b.score), sub:DIFF[b.diff].label, at:b.at});
    }
  });
  rows.sort((a, b) => b.score - a.score || a.at - b.at);
  return rows;
}
const LAST_SCORES = new Map();
function renderBoard(tab, scroll = true, live = false){
  VIEW = 'board'; stopGame(); if (GLOBE) GLOBE.stop();
  BOARD_TAB = tab || 'general';
  const src = boardSource();
  const rows = boardRows(BOARD_TAB);
  const status = src.shared ? '<span class="src live"><i></i>Classement partagé en direct</span>'
    : DB.status === 'loading' ? '<span class="src"><i></i>Connexion au classement partagé…</span>'
    : DB.status === 'slow' ? '<span class="src"><i></i>Classement partagé injoignable pour l’instant · scores de cet appareil</span>'
    : '<span class="src"><i></i>Scores enregistrés sur cet appareil</span>';
  const tabs = [{id:'general', short:'Général'}, ...MODES];
  const date = t => t ? new Date(t).toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) : '';
  const who = r => { const br = bestRankFor(r.id); return `<span class="who">${avatarHTML(r.pseudo, r.color, br)}<span class="namecol"><span>${nameHTML(r.pseudo, r.id)}${src.shared ? `<i class="on-dot" data-online="${esc(r.id)}" title="En ligne" hidden></i>` : ''}${r.me ? ' <span class="chip" style="margin-left:4px">toi</span>' : ''}</span>${titleHTML(br)}</span></span>`; };
  const flashOf = r => { const k = BOARD_TAB + '|' + r.id, old = LAST_SCORES.get(k); return live && (old === undefined || r.score > old); };
  const flashed = new Set(rows.filter(flashOf).map(r => r.id));
  rows.forEach(r => LAST_SCORES.set(BOARD_TAB + '|' + r.id, r.score));
  const pod = (r, i) => { if (!r) return '<div></div>'; const rf = BOARD_TAB === 'general' ? {i:r.ri, div:0, name:RANKS[r.ri].n} : rankFull(r.score); const br = bestRankFor(r.id);
    return `<div class="pod p${i + 1}" style="--rc:${RANKS[r.ri].c}"><span class="place">${i + 1}${i ? 'e' : 'er'}</span>${emblem(rf.i, rf.div)}<b>${nameHTML(r.pseudo, r.id)}</b>${titleHTML(br)}<span class="sc">${fmt(r.score)} pts</span><span class="muted small">${rf.name} · ${esc(r.sub)}</span></div>`; };
  app.innerHTML = `<section class="board">
    <div class="sec-head"><h2>Classement</h2>${status}</div>
    <div class="glass online" id="onlinePanel"></div>
    <div class="tabs" role="group" aria-label="Mode">${tabs.map(t => `<button class="tab" data-act="tab" data-tab="${t.id}" aria-pressed="${t.id === BOARD_TAB}">${esc(t.short)}</button>`).join('')}</div>
    ${rows.length ? `
      <div class="podium">${pod(rows[1], 1)}${pod(rows[0], 0)}${pod(rows[2], 2)}</div>
      <div class="glass tablewrap"><table class="lb"><thead><tr><th>#</th><th>Joueur</th><th>Rang</th><th class="num">Score</th><th>${BOARD_TAB === 'general' ? 'Modes joués' : 'Niveau'}</th><th>Date</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${r.me ? 'me' : ''} ${flashed.has(r.id) ? 'flash' : ''}"><td class="num">${i + 1}</td><td>${who(r)}</td><td>${(() => { const rf = BOARD_TAB === 'general' ? {i:r.ri, div:0, name:RANKS[r.ri].n} : rankFull(r.score); return `<span class="rk">${emblem(rf.i, rf.div)}${rf.name}</span>`; })()}</td><td class="num">${fmt(r.score)}</td><td>${esc(r.sub)}</td><td class="muted">${date(r.at)}</td></tr>`).join('')}</tbody></table></div>
      ${BOARD_TAB === 'general' ? '<p class="muted small">Le score général additionne ton meilleur score de chaque mode.</p>' : ''}`
    : `<div class="glass empty">Personne n’est encore classé ici.<br><br><button class="btn primary" data-act="${BOARD_TAB === 'general' ? 'play' : 'mode'}" data-id="${BOARD_TAB}">Jouer pour ouvrir le classement</button></div>`}
  </section>`;
  if (scroll) window.scrollTo({top:0});
  renderLive();
  if (!live) pushPresence();
}

/* =====================================================================
   Navigation et clavier
   ===================================================================== */
document.addEventListener('click', e => {
  const z = e.target.closest('[data-z]');
  if (z && G && G.map){ const v = z.dataset.z; if (v === 'in') G.map.zoomBy(1.7); else if (v === 'out') G.map.zoomBy(1 / 1.7); else G.map.reset(400); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'home') renderHome();
  else if (a === 'play'){ if (VIEW !== 'home') renderHome(); setTimeout(() => { const el = $('#modes'); if (el) el.scrollIntoView({behavior:REDUCED ? 'auto' : 'smooth', block:'start'}); }, 30); }
  else if (a === 'board') renderBoard(b.dataset.tab || BOARD_TAB);
  else if (a === 'tab') renderBoard(b.dataset.tab, false);
  else if (a === 'diff'){ DIFFK = b.dataset.v; store.set(LS.diff, DIFFK); document.querySelectorAll('.diff').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === DIFFK))); }
  else if (a === 'mode') startGame(b.dataset.id);
  else if (a === 'next') nextQuestion();
  else if (a === 'skip') skipTyped();
  else if (a === 'profile') openProfile(() => renderChatFoot());
  else if (a === 'chat') toggleChat();
  else if (a === 'sound'){ SOUND = !SOUND; store.set(LS.sound, SOUND); renderSoundBtn(); if (SOUND) sfx('good'); }
});
document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('#chat')){ if (e.key === 'Escape') toggleChat(false); return; }
  if (!G || $('.modal')) return;
  if (e.key === 'Enter' && G.answered){ e.preventDefault(); nextQuestion(); }
  else if (e.key === 'Escape' && !G.answered) skipTyped();
});

(function sky(){
  const c = $('#sky'); if (!c) return;
  const ctx = c.getContext('2d');
  let stars = [], w = 0, h = 0;
  const build = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    stars = Array.from({length:Math.round(innerWidth * innerHeight / 5200)}, () => ({x:Math.random() * w, y:Math.random() * h, r:(Math.random() * 1.1 + .25) * dpr, a:Math.random() * .7 + .15, p:Math.random() * 6.28, s:Math.random() * .0015 + .0004}));
  };
  const draw = now => {
    ctx.clearRect(0, 0, w, h);
    for (const st of stars){
      const tw = REDUCED ? 1 : .65 + .35 * Math.sin(st.p + now * st.s);
      ctx.globalAlpha = st.a * tw; ctx.fillStyle = '#dceaff';
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
    }
    if (!REDUCED) setTimeout(() => requestAnimationFrame(draw), 60);
  };
  build(); addEventListener('resize', () => { build(); if (REDUCED) draw(0); });
  requestAnimationFrame(draw);
})();
renderSoundBtn();
renderProfChip();
renderHome();
initDB();
initRoom();
