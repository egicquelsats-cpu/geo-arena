<style>
/* Direction : la Terre vue de nuit. Ciel étoilé, aurore cyan, océan profond, terres sable, épingles corail-ambre. */
:root{
  color-scheme:dark;
  --deep:#030817;
  --sea:#071a36;
  --sea-2:#0d2d57;
  --ink:#f4f1ea;
  --muted:#8fa3c0;
  --faint:rgba(190,220,255,.09);
  --line:rgba(190,220,255,.15);
  --land:#f2e5c6;
  --land-hi:#fffaf0;
  --coast:#b99a5e;
  --accent:#ff6a4d;
  --accent-2:#ffb547;
  --accent-ink:#1d0a03;
  --cyan:#4fd8ff;
  --gold:#ffd166;
  --good:#3ee0a8;
  --bad:#ff5c7a;
  --glass:rgba(6,18,42,.62);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:clip}
body{
  background:var(--deep);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:
    radial-gradient(1100px 680px at 88% -12%,rgba(79,216,255,.17),transparent 62%),
    radial-gradient(900px 620px at -12% 108%,rgba(255,106,77,.15),transparent 60%),
    linear-gradient(180deg,#05102a 0%,#030817 55%,#02050e 100%);
  background-attachment:fixed;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.aurora{position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:-1;pointer-events:none;opacity:.55;filter:blur(70px);
  background:radial-gradient(40% 50% at 30% 50%,rgba(62,224,168,.22),transparent 70%),radial-gradient(35% 45% at 65% 40%,rgba(79,216,255,.22),transparent 70%),radial-gradient(30% 40% at 85% 60%,rgba(140,110,255,.16),transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{from{transform:translate3d(-4%,0,0) scaleY(1)}to{transform:translate3d(4%,3%,0) scaleY(1.15)}}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.shell{max-width:1280px;margin:0 auto;padding:0 20px 72px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}

/* En-tête */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 20px;margin:0 auto;max-width:1280px}
.top::before{content:"";position:absolute;inset:0 -100vw;background:linear-gradient(rgba(3,8,23,.92),rgba(3,8,23,.55));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:-1;border-bottom:1px solid var(--faint)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand svg{flex:none}
.brand em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;background:rgba(243,238,227,.06);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;transition:background .2s,border-color .2s,transform .12s;white-space:nowrap}
.btn:hover{background:rgba(243,238,227,.11);border-color:rgba(243,238,227,.28)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);font-weight:700;box-shadow:0 10px 26px -10px rgba(255,106,77,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 12px 30px -8px rgba(255,140,77,.85),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.big{padding:14px 26px;font-size:1.05rem}
.btn.icon{padding:10px;width:42px;height:42px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip-prof{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;color:#160a04;background:var(--av,#ff5b3a);flex:none}
.chip-prof .emblem{width:24px;height:24px}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px;align-items:center;padding:34px 0 26px}
.eyebrow{margin:0 0 14px;font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,5.4vw,5.3rem);white-space:nowrap;line-height:.88;letter-spacing:-.045em;margin:0 0 22px;text-wrap:balance}
.hero h1 .l2{display:block;padding-bottom:.08em;background:linear-gradient(100deg,var(--accent) 0%,var(--accent-2) 42%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.lede{max-width:50ch;color:var(--muted);font-size:1.1rem;margin:0 0 28px;text-wrap:pretty}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero-me{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.92rem}
.globe-wrap{position:relative;width:100%;max-width:560px;aspect-ratio:1;justify-self:center}
.globe-wrap canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.globe-wrap canvas:active{cursor:grabbing}
.globe-tag{position:absolute;font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(6,14,29,.6)}
.globe-tag.t1{left:2%;top:12%}
.globe-tag.t2{right:0;bottom:14%}

.section{margin-top:46px;scroll-margin-top:90px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.03em;margin:0;line-height:1}
.sec-head p{margin:0;color:var(--muted);max-width:52ch}

.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.diff{text-align:left;cursor:pointer;padding:18px 20px;border-radius:20px;background:rgba(243,238,227,.04);border:1px solid var(--line);display:grid;gap:6px;transition:border-color .2s,background .2s}
.diff:hover{border-color:rgba(243,238,227,.3)}
.diff[aria-pressed="true"]{background:linear-gradient(160deg,rgba(255,106,77,.16),rgba(255,181,71,.06));border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,0 14px 34px -18px rgba(255,106,77,.8)}
.diff .d-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.diff b{font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.diff .mult{font-family:var(--mono);font-size:.9rem;color:var(--gold)}
.diff p{margin:0;color:var(--muted);font-size:.9rem}
.diff .cap{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--ink);margin-top:4px}
.diff .cap .emblem{width:22px;height:22px}

.group-label{display:flex;align-items:center;gap:12px;margin:26px 0 12px;font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.group-label::after{content:"";flex:1;height:1px;background:var(--faint)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mode{position:relative;text-align:left;cursor:pointer;padding:0;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,rgba(14,44,88,.78),rgba(5,16,38,.9));backdrop-filter:blur(8px);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s}
.mode:hover{transform:translateY(-4px);border-color:rgba(79,216,255,.55);box-shadow:0 22px 46px -20px rgba(79,216,255,.45)}
.mini{height:150px;display:grid;place-items:center;background:radial-gradient(120% 100% at 50% 20%,#14417a,#081a3a 70%);border-bottom:1px solid var(--faint)}
.mini svg{width:100%;height:100%}
.mini.loading{background:linear-gradient(100deg,#0c1b36 30%,#14294f 50%,#0c1b36 70%) 0 0/300% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.mini .m-land{fill:var(--land);stroke:var(--coast);stroke-width:.5}
.mini .m-land2{fill:#20385f}
.mini .m-hi{fill:var(--accent)}
.mini .m-dot{fill:var(--accent);stroke:#fff;stroke-width:1}
.mode-body{padding:16px 18px 18px;display:grid;gap:8px;flex:1}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode h3{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;margin:0;line-height:1.1}
.tag{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.map{color:#7fd8ff;border-color:rgba(127,216,255,.35)}
.tag.type{color:var(--gold);border-color:rgba(246,196,83,.4)}
.mode p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.45}
.mode-best{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--faint);font-size:.86rem;color:var(--muted)}
.mode-best .emblem{width:26px;height:26px}
.mode-best b{color:var(--ink);font-family:var(--mono);font-weight:500}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how-item{padding:20px;border-radius:20px;border:1px solid var(--line);background:rgba(243,238,227,.035)}
.how-item .n{font-family:var(--mono);color:var(--accent);font-size:.8rem;letter-spacing:.1em}
.how-item h3{font-family:var(--display);font-size:1.15rem;margin:6px 0 6px;letter-spacing:-.02em}
.how-item p{margin:0;color:var(--muted);font-size:.92rem}
.how-item code{font-family:var(--mono);font-size:.85rem;color:var(--gold)}

.ladder{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.rung{display:grid;justify-items:center;gap:6px;padding:16px 6px 14px;border-radius:18px;border:1px solid var(--line);background:rgba(243,238,227,.03);text-align:center}
.rung .emblem{width:58px;height:58px;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--rc) 45%,transparent))}
.rung b{font-family:var(--display);font-size:.95rem;letter-spacing:-.01em;line-height:1.1}
.rung span{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.rung.cur{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc) inset,0 0 30px -10px var(--rc)}
.credits{margin-top:44px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--faint);padding-top:18px}

/* Partie */
.arena{position:relative;margin-top:14px}
.hud{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
.qcard{flex:1;min-width:0;padding:16px 18px 14px;display:grid;gap:10px}
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(243,238,227,.08);color:var(--ink)}
.chip.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.q-count{margin-left:auto;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.q-count b{color:var(--ink);font-weight:500}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
.linkbtn:hover{color:var(--ink)}
.q-main{display:flex;align-items:center;gap:16px}
.q-text{flex:1;min-width:0}
.q-prompt{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.9rem);line-height:1.12;letter-spacing:-.025em;margin:0;text-wrap:balance}
.q-prompt .hl{color:var(--accent)}
.q-hint{margin:6px 0 0;font-size:.92rem;color:var(--gold);min-height:1.4em;font-family:var(--mono);letter-spacing:.02em}
.tring{position:relative;width:62px;height:62px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:5}
.tr-bg{stroke:rgba(243,238,227,.12)}
.tr-fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:138.23;transition:stroke .3s}
.tring.low .tr-fg{stroke:var(--bad)}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.2rem;font-weight:500}
.tring.low span{color:var(--bad);animation:beat .5s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.12)}}
.dots{display:flex;gap:5px}
.dots i{flex:1;height:5px;border-radius:9px;background:rgba(243,238,227,.12);transition:background .3s}
.dots i.cur{background:rgba(243,238,227,.55)}
.dots i.hit{background:var(--good)}
.dots i.part{background:var(--gold)}
.dots i.miss{background:var(--bad)}
.scard{width:200px;flex:none;padding:16px 18px;display:grid;align-content:center;gap:2px}
.scard small{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.scard b{font-family:var(--mono);font-weight:500;font-size:2rem;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.streak{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted);min-height:1.5em}
.streak.on{color:#ffb38f}
.streak svg{width:15px;height:15px}

.stage{position:relative;height:clamp(420px,calc(100vh - 290px),780px);border-radius:28px;overflow:hidden;border:1px solid rgba(79,216,255,.18);
  box-shadow:0 30px 80px -40px rgba(79,216,255,.35),inset 0 0 120px rgba(0,0,0,.45);
  background:repeating-radial-gradient(circle at 32% 42%,rgba(120,200,255,.035) 0 1px,transparent 1px 34px),radial-gradient(120% 90% at 50% 32%,#134177 0%,#0a2650 42%,#05142e 100%)}
.maphost{position:absolute;inset:0}
.stage .loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.9rem}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(243,238,227,.15);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.zoomctl{position:absolute;right:14px;bottom:14px;display:grid;gap:6px;z-index:3}
.zoomctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-size:1.2rem;line-height:1;display:grid;place-items:center;backdrop-filter:blur(10px)}
.zoomctl button:hover{border-color:rgba(243,238,227,.35)}
.coord{position:absolute;left:14px;bottom:14px;z-index:3;font-family:var(--mono);font-size:.76rem;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-variant-numeric:tabular-nums;pointer-events:none}
.popups{position:absolute;inset:0;pointer-events:none;z-index:4}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--gold);text-shadow:0 2px 0 #000,0 0 22px rgba(255,209,102,.7);animation:popup 1.3s cubic-bezier(.2,.8,.2,1) forwards;white-space:nowrap}
.pop.zero{color:var(--bad);text-shadow:0 2px 0 #000}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}15%{opacity:1;transform:translate(-50%,-120%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}

.dock{margin-top:12px;pointer-events:none}
.dock>*{pointer-events:auto}
.dock>.tip,.dock>.tipbar{pointer-events:none}
.dock>.tipbar>.btn{pointer-events:auto}
.tip{padding:12px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;justify-content:center;text-align:center}
.tipbar .btn.skip{pointer-events:auto;padding:12px 18px}
.tip kbd,.res kbd{font-family:var(--mono);font-size:.75rem;padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.ansform{padding:10px;display:flex;gap:8px;align-items:center}
.ansform input{flex:1;min-width:0;font:inherit;font-size:1.2rem;font-weight:600;color:var(--ink);background:rgba(6,14,29,.7);border:1px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;transition:border-color .2s}
.ansform input:focus{border-color:var(--gold)}
.ansform input::placeholder{color:#5c6b85;font-weight:500}
.ansform.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tries{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding:0 6px;white-space:nowrap}
.tries.warn{color:var(--bad)}
.res{padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;animation:rise .35s cubic-bezier(.2,.8,.2,1) both;border-left:4px solid var(--muted)}
.res.hit{border-left-color:var(--good)}
.res.part{border-left-color:var(--gold)}
.res.miss{border-left-color:var(--bad)}
.res-main{flex:1;min-width:220px}
.res-title{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;margin:0}
.res.hit .res-title{color:var(--good)}
.res.part .res-title{color:var(--gold)}
.res.miss .res-title{color:var(--bad)}
.res-detail{margin:2px 0 0;font-size:.95rem}
.res-break{margin:4px 0 0;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.res-pts{font-family:var(--mono);font-size:2rem;color:var(--gold);font-weight:500;font-variant-numeric:tabular-nums}
.res.miss .res-pts{color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (min-width:900px){
  .arena .hud{position:absolute;top:14px;left:14px;right:14px;z-index:5;margin:0;pointer-events:none}
  .arena .hud>*{pointer-events:auto}
  .arena .hud>.spacer{pointer-events:none}
  .arena .qcard{max-width:560px}
  .arena .hud .spacer{flex:1}

.count{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;background:radial-gradient(closest-side,rgba(3,8,23,.55),transparent)}

/* Carte */

.map .area{fill:var(--land);stroke:var(--coast);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .18s}
.map.france .area{stroke-width:1.3}
.map.noborders .area{stroke:var(--land);stroke-width:.8}
.map .regline{fill:none;stroke:#7d6a44;stroke-width:1.8;vector-effect:non-scaling-stroke;pointer-events:none}
.map.deps .area{stroke-width:.8}
.idf{position:absolute;z-index:4;left:14px;top:190px;width:260px;border-radius:18px;overflow:hidden;background:radial-gradient(120% 100% at 50% 30%,#17325f,#0b1a33);border:1px solid rgba(246,196,83,.35);box-shadow:0 18px 40px -18px #000}
.idf-h{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--faint);background:rgba(6,14,29,.6)}
.idf svg{display:block;width:100%;height:auto;touch-action:manipulation}
.idf svg.clickable{cursor:crosshair}
@media (max-width:899px){ .idf{left:10px;top:10px;width:clamp(130px,38vw,180px)} .idf-h{font-size:.6rem;padding:5px 8px} }
.map .outline{fill:none;stroke:#8d7850;stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}
.map.hoverable .area:hover{fill:var(--land-hi)}
.map .area.target{fill:var(--accent);stroke:#ffe1c2;filter:drop-shadow(0 0 6px rgba(255,106,77,.8))}
.map .area.hit{fill:var(--good);stroke:#d6ffe9}
.map .area.reveal{fill:var(--good);stroke:#d6ffe9;animation:flash 1s ease-in-out 2}
.map .area.wrong{fill:#f2a593}
@keyframes flash{50%{fill:#8ff0c0}}
.map .gline{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.map .ring{fill:rgba(255,91,58,.12);stroke:var(--accent);stroke-width:2.5;animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.map .pin-you path{fill:var(--accent);stroke:#fff;stroke-width:1.6}
.map .pin-true path{fill:var(--good);stroke:#fff;stroke-width:1.6}
.map .pin circle{fill:#fff}
.map .pin{animation:drop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.map .lbl{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:#06101f;stroke-width:4px;stroke-linejoin:round}
.map .lbl.km{font-family:var(--mono);font-weight:500;font-size:13px;fill:var(--gold)}

/* Fin de partie */
.end{display:grid;gap:14px;margin-top:22px}

.end-info{position:relative;min-width:0}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;min-height:0}

.next{max-width:520px}
.next-l{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--muted);margin-bottom:8px}

.bar{height:10px;border-radius:99px;background:rgba(243,238,227,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 70%,#000),var(--rc));transition:width 1.4s cubic-bezier(.2,.8,.2,1) .3s}
.end-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.panel{padding:22px}

.stat{padding:12px 14px;border-radius:14px;background:rgba(243,238,227,.04);border:1px solid var(--faint)}
.stat small{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.small{font-size:.86rem}
.recap{width:100%;border-collapse:collapse}
.recap td{padding:9px 8px;border-top:1px solid var(--faint);font-size:.93rem;vertical-align:middle}

/* Classement */
.board{margin-top:26px}

.live-chip{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;padding:9px 14px}

.online{padding:16px 18px;margin-bottom:16px}

.on-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--good)}

@keyframes rowflash{0%{background:rgba(246,196,83,.35)}100%{background:transparent}}

.chat-btn{position:relative}

<script>
/* Passerelle Firebase : expose la même interface que la plateforme Claude
   (db, user, room) pour que le jeu fonctionne à l'identique sur un site web. */
(function(){
  var cfg = window.GEO_ARENA_CONFIG || {};
  if (!cfg.firebase) return;
  var V = '10.12.2', base = 'https://www.gstatic.com/firebasejs/' + V + '/';
  function load(src){ return new Promise(function(ok, ko){ var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
  var ready = (async function(){
    await load(base + 'firebase-app-compat.js');
    await load(base + 'firebase-auth-compat.js');
    await load(base + 'firebase-firestore-compat.js');
    firebase.initializeApp(cfg.firebase);
    var auth = firebase.auth();
    await new Promise(function(res, rej){
      var off = auth.onAuthStateChanged(function(u){ if (u){ off(); res(); } });
      auth.signInAnonymously().catch(rej);
    });
    return {fs:firebase.firestore(), uid:auth.currentUser.uid};
  })();
  ready.catch(function(e){ console.warn('Géo Arena : connexion Firebase impossible, passage en mode solo.', e); });

  var roomP = null;
  function makeRoom(fs, uid){
    var TAB = Math.random().toString(36).slice(2, 10), DOC = uid + '_' + TAB;
    var ref = fs.collection('presence').doc(DOC);
    var mine = {}, handlers = [], peers = Object.freeze([]), timer = 0, last = [];
    function write(){ return ref.set({by:uid, presence:mine, at:Date.now()}).catch(function(){}); }
    function schedule(){ clearTimeout(timer); timer = setTimeout(write, 350); }
    function deliver(){
      var now = Date.now();
      peers = Object.freeze(last.filter(function(p){ return now - p.updatedAt < 75000; }));
      handlers.forEach(function(h){ try { h({peers:peers, joined:[], left:[], updated:[]}); } catch(e){} });
    }
    setInterval(write, 25000);
    setInterval(deliver, 20000);
    addEventListener('pagehide', function(){ ref.delete().catch(function(){}); });
    fs.collection('presence').onSnapshot(function(snap){
      last = snap.docs.map(function(d){
        var v = d.data() || {};
        return {peer:d.id, by:typeof v.by === 'string' ? v.by : null, isMe:v.by === uid, sameTab:d.id === DOC, kind:'viewer', guest:false,
          presence:(v.presence && typeof v.presence === 'object') ? v.presence : {}, updatedAt:+v.at || 0};
      });
      deliver();
    }, function(){});
    write();
    return {
      presence:function(patch){
        var n = Object.assign({}, mine);
        Object.keys(patch || {}).forEach(function(k){ if (patch[k] === null) delete n[k]; else n[k] = patch[k]; });
        mine = n; schedule(); return Promise.resolve();
      },
      onPeers:function(fn){ handlers.push(fn); setTimeout(function(){ fn({peers:peers, joined:[], left:[], updated:[]}); }, 0); return function(){ handlers = handlers.filter(function(h){ return h !== fn; }); }; },
      peers:function(){ return peers; },
      connected:function(){ return true; }
    };
  }

  window.claude = {
    use: async function(name){
      try {
        var r = await ready, fs = r.fs, uid = r.uid;
        if (name === 'db') return {collection:function(p){ return fs.collection(p); }, doc:function(p){ return fs.doc(p); }};
        if (name === 'user') return {
          id:async function(){ return uid; },
          can:async function(){ return true; },
          isOwner:async function(){ return !!cfg.adminUid && cfg.adminUid === uid; }
        };
        if (name === 'room'){ if (!roomP) roomP = makeRoom(fs, uid); return roomP; }
        return null;
      } catch(e){ return null; }
    }
  };
})();
</script>

function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function deacc(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function norm(s){ return deacc(s).replace(/[^a-z0-9]/g, ''); }
function clean(s){
  let t = deacc(s).replace(/[’'`]/g, ' ').replace(/[-_.]/g, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(/^(le|la|les|l)\s+/, '').replace(/\bsaint\b/g, 'st').replace(/\bsainte\b/g, 'ste');
  return t.replace(/[^a-z0-9]/g, '');
}
function lev(a, b){
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length:n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const exactMatch = (v, list) => { const c = clean(v); return !!c && list.some(a => clean(a) === c); };
let UNIVERSE = null;
const fuzzyMatch = (v, list) => {
  const c = clean(v); if (!c) return false;

  let bestOwn = Infinity;
  own.forEach(x => { const tol = x.length >= 9 ? 2 : x.length >= 5 ? 1 : 0; const dd = lev(x, c); if (dd <= tol) bestOwn = Math.min(bestOwn, dd); });
  if (!isFinite(bestOwn)) return false;
  // refusé si un autre pays ou une autre capitale est aussi proche de ce qui a été tapé
  return !UNIVERSE.some(x => !own.has(x) && lev(x, c) <= bestOwn);
};
function pattern(word, reveal){
  // reveal = 'first' : première lettre + tirets
  let first = true;

    first = ch === ' ' || ch === '-' ? false : first;

}

const URLS = {
  land:  'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json/+esm',
  world: 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json/+esm',
  fr:    'https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.0/countries/fr/fr-all.topo.json/+esm',
  dep:   'https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.0/countries/fr/fr-all-all.topo.json/+esm'
};
const GEO = {land:null, world:[], byKey:new Map(), regions:[], frFC:null, frOutline:null, ready:false, error:null};

function rewind(f){
  const g = f && f.geometry; if (!g) return f;
  const fix = poly => d3.geoArea({type:'Polygon', coordinates:poly}) > 2 * Math.PI ? poly.map(r => r.slice().reverse()) : poly;
  if (g.type === 'Polygon') g.coordinates = fix(g.coordinates);
  else if (g.type === 'MultiPolygon') g.coordinates = g.coordinates.map(fix);
  return f;
}
const featKey = f => (f.id != null && f.id !== '' && !isNaN(+f.id)) ? String(+f.id).padStart(3, '0') : 'n:' + (f.properties && f.properties.name);

const landP = import(URLS.land).then(m => { const t = m.default; GEO.land = topojson.feature(t, t.objects.land); return GEO.land; });
const geoP = Promise.all([import(URLS.world), import(URLS.fr)]).then(([wm, fm]) => {
  const wt = wm.default, ft = fm.default;
  GEO.world = topojson.feature(wt, wt.objects.countries).features.filter(f => featKey(f) !== '010');
  GEO.world.forEach(f => { f.k = featKey(f); GEO.byKey.set(f.k, f); });
  COUNTRIES.forEach(c => { c.f = GEO.byKey.get(c.key) || null; });

  const obj = ft.objects[Object.keys(ft.objects)[0]];
  const feats = topojson.feature(ft, obj).features;
  const wanted = new Set(REGIONS.map(r => norm(r.name)));
  REGIONS.forEach(r => {
    const f = feats.find(x => x.properties && norm(x.properties.name) === norm(r.name));
    if (f){ r.f = rewind(f); f.k = r.key; }
  });
  GEO.regions = REGIONS.filter(r => r.f);
  const geoms = obj.geometries.filter(g => g.properties && wanted.has(norm(g.properties.name)));
  GEO.frOutline = rewind({type:'Feature', geometry:topojson.merge(ft, geoms)});
  GEO.frFC = {type:'FeatureCollection', features:GEO.regions.map(r => r.f)};
  CITIES.forEach(c => { const r = GEO.regions.find(r => d3.geoContains(r.f, [c.lon, c.lat])); c.region = r ? r.name : null; });
  GEO.ready = true;
  return GEO;
}).catch(e => { GEO.error = e; throw e; });
geoP.catch(() => {});
landP.catch(() => {});

let depP = null;
function loadDeps(){
  if (depP) return depP;
  depP = geoP.then(() => import(URLS.dep)).then(m => {
    const t = m.default, obj = t.objects[Object.keys(t.objects)[0]];
    const geoms = obj.geometries.filter(g => (g.type === 'Polygon' || g.type === 'MultiPolygon') && g.properties);
    const feats = topojson.feature(t, {type:'GeometryCollection', geometries:geoms}).features.map(rewind);
    const metro = [], metroGeoms = [];
    feats.forEach((f, i) => {
      const c = d3.geoCentroid(f);
      if (c[0] < -6 || c[0] > 10 || c[1] < 41 || c[1] > 52) return;
      const rawName = String(f.properties.name || '').replace(/č/g, 'è').replace(/Č/g, 'È');
      const info = DEPT_BY_NORM.get(norm(rawName));
      const reg = REGIONS.find(r => norm(r.name) === norm(f.properties.region || ''));
      f.k = 'D' + i;
      metro.push({key:f.k, f, name:info ? info.name : rawName, code:info ? info.code : '', tier:info ? info.tier : 3, region:reg ? reg.name : (f.properties.region || '')});
      metroGeoms.push(geoms[i]);
    });
    GEO.deps = metro;
    return metro;
  });
  depP.catch(() => { depP = null; });
  return depP;
}

function nearestOnFeature(f, p){
  let best = Infinity, bp = null;
  const g = f.geometry;
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  for (const poly of polys) for (const ring of poly) for (const c of ring){
    const d = d3.geoDistance(p, c);
    if (d < best){ best = d; bp = c; }
  }
  return {d:best * R_EARTH, pt:bp};
}

function starPts(n, R, r, cx = 50, cy = 50, rot = -90){
  const pts = [];

    const a = (rot * Math.PI / 180) + i * Math.PI / n, rr = i % 2 ? r : R;
    pts.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

    compass:`<circle cx="50" cy="52" r="17" fill="#070b18" fill-opacity=".55" stroke="url(#${id}g)" stroke-width="1.5"/><polygon points="${starPts(4, 15, 4, 50, 52)}" fill="url(#${id}g)"/><polygon points="${starPts(4, 9, 2.5, 50, 52, -45)}" fill="#fff" fill-opacity=".75"/>`
  }[T.icon];
  // couronne
  let crown = '';
  if (T.crown){
    const h = 8 + T.crown * 3;
    const top = 12 - h;
    crown = `<g class="e-crown"><path d="M32 14 L35 ${top + 4} L42 ${top + 9} L50 ${top} L58 ${top + 9} L65 ${top + 4} L68 14 Z" fill="url(#${id}m)" stroke="${m2}" stroke-width="1.3" stroke-linejoin="round"/>
      <circle cx="50" cy="${top + 1}" r="2.6" fill="url(#${id}g)" stroke="#fff" stroke-width=".6"/>${T.crown >= 2 ? `<circle cx="35" cy="${top + 4}" r="1.9" fill="url(#${id}g)"/><circle cx="65" cy="${top + 4}" r="1.9" fill="url(#${id}g)"/>` : ''}</g>`;

let AC = null, SOUND = store.get(LS.sound, true);
function sfx(kind){
  if (!SOUND) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const tone = (f, t, d, type = 'sine', g = .07, f2) => {
      const o = AC.createOscillator(), v = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, now + t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + t + d);
      v.gain.setValueAtTime(.0001, now + t); v.gain.exponentialRampToValueAtTime(g, now + t + .01); v.gain.exponentialRampToValueAtTime(.0001, now + t + d);
      o.connect(v).connect(AC.destination); o.start(now + t); o.stop(now + t + d + .03);
    };
    if (kind === 'good'){ tone(660, 0, .12, 'triangle'); tone(990, .08, .25, 'triangle'); }
    else if (kind === 'part'){ tone(520, 0, .18, 'triangle'); }
    else if (kind === 'bad'){ tone(220, 0, .28, 'sawtooth', .04, 140); }
    else if (kind === 'tick'){ tone(1200, 0, .05, 'square', .025); }
    else if (kind === 'start'){ tone(440, 0, .1, 'triangle'); tone(660, .1, .1, 'triangle'); tone(880, .2, .18, 'triangle'); }
    else if (kind === 'combo'){ tone(523, 0, .09, 'square', .035); tone(784, .07, .09, 'square', .035); tone(1046, .14, .16, 'square', .04); }
    else if (kind === 'rank'){ [523, 659, 784, 1047].forEach((f, k) => tone(f, k * .11, .35, 'triangle', .06)); }
  } catch(e){}
}

function sanitizePlayer(v){
  if (!v || typeof v !== 'object') return null;
  const pseudo = String(v.pseudo || '').slice(0, 16).trim();
  if (!pseudo) return null;
  const color = COLORS.includes(v.color) ? v.color : COLORS[0];
  const best = {};
  if (v.best && typeof v.best === 'object') for (const m of MODES){
    const b = v.best[m.id];
    if (b && typeof b.score === 'number' && isFinite(b.score)) best[m.id] = {score:clamp(Math.round(b.score), 0, 30000), diff:DIFF[b.diff] ? b.diff : 'moyen', at:+b.at || 0};
  }
  return {pseudo, color, best, games:+v.games || 0};
}
function localPlayers(){
  const raw = store.get(LS.players, {}), out = new Map();
  for (const [id, v] of Object.entries(raw)){ const p = sanitizePlayer(v); if (p) out.set(id, p); }
  return out;
}
function myBest(){
  const p = getProfile(); if (!p) return {};
  const fromLocal = (localPlayers().get(p.id) || {}).best || {};
  const fromDB = DB.uid ? ((DB.players.get(DB.uid) || {}).best || {}) : {};

function peerInfo(pe){
  const pr = pe.presence || {};

  const pseudo = typeof pr.p === 'string' ? pr.p.slice(0, 16).trim() : '';
  return {key:pe.by || pe.peer, by:pe.by, me:pe.isMe, pseudo:pseudo || 'Invité', anon:!pseudo,

function onlineList(){

/* ---------- Chat en direct ----------
   Un document par joueur (chat/<id>) qui garde ses 30 derniers messages :
   tout le monde lit tout, chacun n'écrit que le sien. */
const CHAT = {on:false, open:false, list:[], docs:new Map(), sending:false, last:0, seen:store.get('ga2-chat-seen', 0), status:'off'};
const CHAT_MAX = 240;
function cleanText(t){ return String(t || '').replace(/[\u0000-\u0008\u000B-\u001F\u007F\u200B-\u200F\u202A-\u202E\u2066-\u2069]/g, '').replace(/\s+/g, ' ').trim().slice(0, CHAT_MAX); }
function sanitizeChatDoc(v){
  if (!v || typeof v !== 'object') return null;
  const pseudo = String(v.pseudo || '').slice(0, 16).trim(); if (!pseudo) return null;
  const color = COLORS.includes(v.color) ? v.color : COLORS[0];
  const msgs = Array.isArray(v.msgs) ? v.msgs.slice(-30).map(m => ({t:+m.t || 0, x:cleanText(m.x)})).filter(m => m.x && m.t) : [];
  return {pseudo, color, msgs};
}
function startChat(){
  if (!DB.db) return;
  CHAT.on = true; CHAT.status = 'loading'; renderChat();
  const timer = setTimeout(() => { if (CHAT.status === 'loading'){ CHAT.status = 'slow'; renderChat(); } }, 10000);
  DB.db.collection('chat').onSnapshot(snap => {
    clearTimeout(timer);
    const docs = new Map();
    snap.docs.forEach(d => { const c = sanitizeChatDoc(d.data()); if (c) docs.set(d.id, c); });
    CHAT.docs = docs;
    const all = [];
    docs.forEach((c, id) => c.msgs.forEach(m => all.push({id, me:id === DB.uid, pseudo:c.pseudo, color:c.color, t:m.t, x:m.x})));
    all.sort((a, b) => a.t - b.t);
    const before = CHAT.list.length;
    CHAT.list = all.slice(-120);
    CHAT.status = 'live';
    renderChat(CHAT.list.length > before);
  }, () => { clearTimeout(timer); CHAT.status = 'error'; renderChat(); });
}
function chatUnread(){ return CHAT.list.filter(m => !m.me && m.t > CHAT.seen).length; }
function renderChat(grew){
  const badge = $('#chatBadge');
  if (CHAT.open && CHAT.list.length){ CHAT.seen = Math.max(CHAT.seen, CHAT.list[CHAT.list.length - 1].t); store.set('ga2-chat-seen', CHAT.seen); }

  if (!DB.db || CHAT.status === 'error') list.innerHTML = '<p class="chat-empty">Le chat en direct n’est pas encore activé sur ce site.</p>';
  else if (CHAT.status === 'loading') list.innerHTML = '<p class="chat-empty"><span class="spinner" style="display:block"></span>Connexion au chat…</p>';
  else if (!CHAT.list.length) list.innerHTML = `<p class="chat-empty">${CHAT.status === 'slow' ? 'Le chat met du temps à répondre.' : 'Aucun message pour l’instant.<br>Lance la discussion !'}</p>`;
  else {
    let lastDay = '';
    list.innerHTML = CHAT.list.map(m => {
      const d = day(m.t); const sep = d !== lastDay ? `<span class="chat-day">${esc(d)}</span>` : ''; lastDay = d;
      const rk = bestRankFor(m.id);
      return `${sep}<div class="msg ${m.me ? 'me' : ''}">${avatarHTML(m.pseudo, m.color, rk)}

}
function renderChatFoot(){
  const foot = $('#chatFoot'), prof = getProfile();
  const keep = foot.querySelector('#chatIn');
  if (!DB.db){ foot.innerHTML = ''; return; }
  if (!prof){ foot.innerHTML = '<p class="chat-note">Crée ton profil pour écrire.</p><button class="btn primary" style="width:100%" data-act="profile">S’inscrire</button>'; return; }

  if (keep) return;

  const inp = $('#chatIn');

}
async function sendChat(){
  const inp = $('#chatIn'); if (!inp) return;
  const x = cleanText(inp.value);
  if (!x || CHAT.sending) return;
  const wait = 1500 - (Date.now() - CHAT.last);
  if (wait > 0){ $('#chatCount').textContent = 'Doucement… attends une seconde.'; return; }
  const prof = getProfile(); if (!prof || !DB.uid) return;
  CHAT.sending = true; $('#chatSend').disabled = true;
  try {
    const ref = DB.db.doc('chat/' + DB.uid);
    let mine = CHAT.docs.get(DB.uid);
    if (!mine){ try { const sn = await ref.get(); if (sn.exists) mine = sanitizeChatDoc(sn.data()); } catch(e){} }
    const msgs = ((mine && mine.msgs) || []).concat({t:Date.now(), x}).slice(-30);
    await ref.set({pseudo:prof.pseudo, color:prof.color, msgs});
    inp.value = ''; $('#chatCount').textContent = ''; CHAT.last = Date.now();
  } catch(e){
    if (e && e.code === 'invalid_argument'){ DB.canWrite = false; renderChatFoot(); }
    else if (e && e.code === 'quota_exceeded') $('#chatCount').textContent = 'Le chat est plein pour le moment.';
    else $('#chatCount').textContent = 'Message non envoyé. Réessaie.';
  }
  CHAT.sending = false; const b = $('#chatSend'); if (b) b.disabled = false;
  const i2 = $('#chatIn'); if (i2) i2.focus();
}
function toggleChat(force){
  CHAT.open = force === undefined ? !CHAT.open : force;
  $('#chat').hidden = !CHAT.open;
  $('#chatBtn').setAttribute('aria-expanded', String(CHAT.open));
  if (CHAT.open){ renderChat(true); setTimeout(() => { const i = $('#chatIn'); if (i && !(G && !G.answered && G.mode.type === 'type')) i.focus(); }, 50); }
  else renderChat();
}

async function initDB(){
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (user){ try { ADMIN_ME = !!(await user.isOwner()); } catch(e){} if (ADMIN_ME) refreshIdentity(); }
    if (!db) return;
    DB.db = db;
    if (user){
      try { DB.uid = await user.id(); } catch(e){}
      try { const w = await user.can('data.write'); if (w === false) DB.canWrite = false; } catch(e){}
    }
    if (DB.uid && !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(DB.uid)) DB.uid = null;
    DB.status = 'loading';
    startChat();
    let adminWritten = false;
    db.doc('meta/admins').onSnapshot(sn => {
      const v = sn.exists ? sn.data() : null;
      const ids = v && Array.isArray(v.ids) ? v.ids.filter(x => typeof x === 'string').slice(0, 20) : [];
      ADMINS = new Set(ids);
      if (ADMIN_ME && DB.uid && !ADMINS.has(DB.uid) && !adminWritten && !sn.metadata.fromCache){
        adminWritten = true;
        db.doc('meta/admins').set({ids:[...ids, DB.uid]}).catch(() => {});
      }
      refreshIdentity();
    }, () => {});
    const timer = setTimeout(() => { if (DB.status === 'loading'){ DB.status = 'slow'; onDBChange(); } }, 10000);
    db.collection('players').onSnapshot(snap => {
      clearTimeout(timer);
      const m = new Map();
      snap.docs.forEach(d => { const p = sanitizePlayer(d.data()); if (p) m.set(d.id, p); });
      if (DB.status === 'live' && !snap.metadata.fromCache){
        m.forEach((p, id) => {
          if (id === DB.uid) return;
          const old = DB.players.get(id);
          for (const mo of MODES){
            const nb = p.best[mo.id], ob = old && old.best[mo.id];
            if (nb && (!ob || nb.score > ob.score)){
              toast(`${emblem(rankIdx(nb.score))}<span><b>${nameHTML(p.pseudo, id)}</b> vient de faire ${fmt(nb.score)} pts en ${esc(mo.short)} · ${RANKS[rankIdx(nb.score)].n}</span>`);
              break;
            }
          }
        });
      }
      DB.players = m;
      DB.status = 'live';
      onDBChange();
    }, () => { clearTimeout(timer); DB.status = 'error'; onDBChange(); });
  } catch(e){}
}

}

async function saveResult(res){
  const prof = getProfile(); if (!prof) return {saved:false};
  const all = store.get(LS.players, {});
  const p = sanitizePlayer(all[prof.id]) || {pseudo:prof.pseudo, color:prof.color, best:{}, games:0};
  p.pseudo = prof.pseudo; p.color = prof.color; p.games = (p.games || 0) + 1;
  if (!p.best[res.mode] || res.score > p.best[res.mode].score) p.best[res.mode] = {score:res.score, diff:res.diff, at:res.at};
  all[prof.id] = p; store.set(LS.players, all);
  let shared = false;
  if (DB.db && DB.uid && DB.canWrite !== false){
    let mine = DB.players.get(DB.uid) || null;
    try { const snap = await DB.db.doc('players/' + DB.uid).get(); if (snap.exists) mine = sanitizePlayer(snap.data()) || mine; } catch(e){}
    mine = mine || {best:{}, games:0};
    const best = {...mine.best};
    if (!best[res.mode] || res.score > best[res.mode].score) best[res.mode] = {score:res.score, diff:res.diff, at:res.at};
    try {
      await DB.db.doc('players/' + DB.uid).set({pseudo:prof.pseudo, color:prof.color, best, games:(mine.games || 0) + 1, updated:Date.now()});
      shared = true;
    } catch(e){
      if (e && e.code === 'invalid_argument') DB.canWrite = false;
    }
  }
  return {saved:true, shared};
}
async function syncProfileToDB(){
  const prof = getProfile();
  if (!prof || !DB.db || !DB.uid || DB.canWrite === false) return;
  const mine = DB.players.get(DB.uid);
  if (!mine) return;
  if (mine.pseudo === prof.pseudo && mine.color === prof.color) return;
  try { await DB.db.doc('players/' + DB.uid).set({pseudo:prof.pseudo, color:prof.color, best:mine.best, games:mine.games, updated:Date.now()}); } catch(e){}
}

/* =====================================================================

function createMap(host, opt){
  const france = opt.view === 'france';
  host.innerHTML = '';
  const box = host.getBoundingClientRect();
  const bw = box.width || 1000, bh = box.height || 560;
  const W = 1000, H = Math.max(320, Math.round(W * bh / bw)), u = W / bw;
  const ins = opt.insets || {l:0, r:0, t:0, b:0};
  let ext = france
    ? [[ins.l * u + 30, ins.t * u + 30], [W - ins.r * u - 30, H - ins.b * u - 30]]
    : [[10, ins.t * u + 10], [W - 10, H - ins.b * u - 10]];
  if (ext[1][0] - ext[0][0] < 250 || ext[1][1] - ext[0][1] < 200) ext = [[20, 20], [W - 20, H - 20]];
  const svg = d3.select(host).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio', 'xMidYMid meet')
    .attr('class', 'map ' + (france ? 'france ' : 'world ') + (opt.layer === 'deps' ? 'deps ' : '') + (opt.borders === false ? 'noborders ' : '') + (opt.hover ? 'hoverable' : ''))
    .attr('role', 'img').attr('aria-label', france ? 'Carte de France' : 'Carte du monde');
  const proj = france
    ? d3.geoConicConformal().parallels([44, 49]).rotate([-3, 0]).fitExtent(ext, GEO.frFC)
    : d3.geoNaturalEarth1().fitExtent(ext, {type:'FeatureCollection', features:GEO.world});
  const path = d3.geoPath(proj);
  const defs = svg.append('defs');
  defs.append('filter').attr('id', 'blur8').attr('x', '-10%').attr('y', '-10%').attr('width', '120%').attr('height', '120%')
    .append('feGaussianBlur').attr('stdDeviation', 9);
  const root = svg.append('g');
  if (!france) root.append('path').attr('class', 'sphere').attr('d', path({type:'Sphere'}));
  root.append('path').attr('class', 'grat').attr('d', path(d3.geoGraticule10()));
  const areaEl = new Map();
  const addEl = (k, el) => { if (!areaEl.has(k)) areaEl.set(k, []); areaEl.get(k).push(el); };
  if (france){
    root.append('g').selectAll('path').data(GEO.world.filter(f => f.k !== '250')).join('path').attr('class', 'nb').attr('d', path);
    root.append('path').attr('class', 'shadow').attr('d', path(GEO.frOutline)).attr('transform', 'translate(0,8)').attr('filter', 'url(#blur8)');
    const items = opt.layer === 'deps' ? GEO.deps : GEO.regions;
    root.append('g').selectAll('path').data(items).join('path').attr('class', 'area').attr('d', r => path(r.f)).each(function(r){ addEl(r.key, this); });
    if (opt.layer === 'deps') root.append('g').selectAll('path').data(GEO.regions).join('path').attr('class', 'regline').attr('d', r => path(r.f));
    root.append('path').attr('class', 'outline').attr('d', path(GEO.frOutline));
  } else {
    root.append('g').selectAll('path').data(GEO.world).join('path').attr('class', 'area').attr('d', path).each(function(f){ addEl(f.k, this); });
  }
  const over = root.append('g');
  const marks = svg.append('g').attr('class', 'marks').style('pointer-events', 'none');
  let T = d3.zoomIdentity, M = [], clickable = false;
  // Encart agrandi de l'Île-de-France (mode départements)
  let inset = null;
  if (opt.idfHost && GEO.deps){
    const pc = GEO.deps.filter(x => ['75', '92', '93', '94'].includes(x.code));
    const idf = pc.length === 4 ? pc : GEO.deps.filter(x => x.region === 'Île-de-France');
    if (idf.length){
      const S = 300;
      const ip = d3.geoConicConformal().parallels([44, 49]).rotate([-3, 0]).fitExtent([[44, 44], [S - 44, S - 44]], {type:'FeatureCollection', features:idf.map(x => x.f)});
      const ipath = d3.geoPath(ip);
      const factor = Math.round(ip.scale() / proj.scale());
      opt.idfHost.innerHTML = `<div class="idf-h"><span>${pc.length === 4 ? 'Paris et petite couronne' : 'Île-de-France'}</span><span>×${factor}</span></div>`;
      const isvg = d3.select(opt.idfHost).append('svg').attr('viewBox', `0 0 ${S} ${S}`).attr('class', svg.attr('class')).attr('role', 'img').attr('aria-label', 'Île-de-France agrandie');
      const cid = 'clip' + Math.random().toString(36).slice(2, 8);
      isvg.append('defs').append('clipPath').attr('id', cid).append('rect').attr('width', S).attr('height', S);
      const ig = isvg.append('g').attr('clip-path', `url(#${cid})`);
      const near = GEO.deps.filter(x => { const b = ipath.bounds(x.f); return b[1][0] > 0 && b[0][0] < S && b[1][1] > 0 && b[0][1] < S; });
      ig.append('g').selectAll('path').data(near).join('path').attr('class', 'area').attr('d', x => ipath(x.f)).each(function(x){ addEl(x.key, this); });
      ig.append('g').selectAll('path').data(GEO.regions).join('path').attr('class', 'regline').attr('d', r => ipath(r.f));
      const iover = ig.append('g');
      const imarks = isvg.append('g').style('pointer-events', 'none');
      isvg.on('click', ev => {
        if (!clickable || !opt.onPick) return;
        const [x, y] = d3.pointer(ev, isvg.node());
        const ll = ip.invert([x, y]); if (!ll || !isFinite(ll[0])) return;
        const m = isvg.node().getScreenCTM(); let sp = null;
        if (m){ const p = isvg.node().createSVGPoint(); p.x = x; p.y = y; const q = p.matrixTransform(m); sp = {x:q.x, y:q.y}; }
        opt.onPick(ll, null, sp);

      inset = {isvg, ip, ipath, iover, imarks, S};
    }
  }
  const maxK = france ? 10 : 90;
  const zoom = d3.zoom().scaleExtent([1, maxK]).translateExtent([[0, 0], [W, H]]).clickDistance(9)
    .on('zoom', e => { T = e.transform; root.attr('transform', T); drawMarks(); });
  svg.call(zoom).on('dblclick.zoom', null);

  const toLL = ev => {
    const [x, y] = d3.pointer(ev, svg.node());
    const g = T.invert([x, y]);
    const ll = proj.invert(g);
    if (!ll || !isFinite(ll[0]) || !isFinite(ll[1])) return null;
    const back = proj(ll);
    if (!back || Math.hypot(back[0] - g[0], back[1] - g[1]) > 2) return null;
    return {ll, pt:[x, y]};
  };
  svg.on('click', ev => {
    if (!clickable || !opt.onPick) return;
    const r = toLL(ev); if (!r) return;
    const s = screenPt(r.pt);
    opt.onPick(r.ll, r.pt, s ? {x:s.x, y:s.y} : null);
  });
  function screenPt(pt){ const n = svg.node(), m = n.getScreenCTM(); if (!m) return null; const p = n.createSVGPoint(); p.x = pt[0]; p.y = pt[1]; return p.matrixTransform(m); }
  svg.on('mousemove', ev => {
    if (!opt.coordEl) return;
    const r = toLL(ev);
    opt.coordEl.textContent = r ? `${fmt1(Math.abs(r.ll[1]))}° ${r.ll[1] >= 0 ? 'N' : 'S'} · ${fmt1(Math.abs(r.ll[0]))}° ${r.ll[0] >= 0 ? 'E' : 'O'}` : 'Hors carte';
  });

  const pinShape = (layer, x, y, cls, sc = 1) => {
    const g = layer.append('g').attr('transform', `translate(${x},${y}) scale(${sc})`).append('g').attr('class', 'pin ' + (cls || 'pin-you'));
    g.append('path').attr('d', 'M0 0 C-5 -8 -10 -13 -10 -19 A10 10 0 1 1 10 -19 C10 -13 5 -8 0 0 Z');
    g.append('circle').attr('cx', 0).attr('cy', -19).attr('r', 3.6);
  };
  function drawMarks(){
    if (inset){
      inset.imarks.selectAll('*').remove();
      for (const m of M){
        if (m.type !== 'pin') continue;
        const p = inset.ip(m.ll);
        if (p && p[0] > -5 && p[0] < inset.S + 5 && p[1] > -5 && p[1] < inset.S + 5) pinShape(inset.imarks, p[0], p[1], m.cls, 1.15);
      }
    }
    marks.selectAll('*').remove();
    for (const m of M){
      const p = proj(m.ll); if (!p) continue;
      const [x, y] = T.apply(p);
      if (m.type === 'ring'){
        marks.append('circle').attr('class', 'ring').attr('cx', x).attr('cy', y).attr('r', m.r || 22);
      } else if (m.type === 'pin'){
        pinShape(marks, x, y, m.cls);
        if (m.label) marks.append('text').attr('class', 'lbl').attr('x', x + 14).attr('y', y - 22).text(m.label);
      } else if (m.type === 'label'){
        marks.append('text').attr('class', 'lbl km').attr('x', x).attr('y', y + 22).attr('text-anchor', 'middle').text(m.label);
      }
    }
  }
  function constrainT(t){
    const k = t.k;
    const x = clamp(t.x, W - W * k, 0), y = clamp(t.y, H - H * k, 0);
    return d3.zoomIdentity.translate(x, y).scale(k);
  }
  function zoomToBounds(b, mk = 12, dur = 700, pad = 1){
    const [[x0, y0], [x1, y1]] = b;
    const dx = Math.max(1, x1 - x0) * pad, dy = Math.max(1, y1 - y0) * pad, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const k = clamp(0.86 / Math.max(dx / W, dy / H), 1, Math.min(mk, maxK));
    const t = constrainT(d3.zoomIdentity.translate(W / 2 - cx * k, H / 2 - cy * k).scale(k));
    if (REDUCED || !dur) svg.call(zoom.transform, t);
    else svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, t);
  }
  const boundsLL = lls => { const ps = lls.map(ll => proj(ll)).filter(Boolean); return [[d3.min(ps, p => p[0]), d3.min(ps, p => p[1])], [d3.max(ps, p => p[0]), d3.max(ps, p => p[1])]]; };
  return {
    svg, proj, path, W, H,
    setClickable(v){
      clickable = v;
      [svg, inset && inset.isvg].forEach(x => { if (x){ x.classed('clickable', v); x.classed('hoverable', v && !!opt.hover); } });
    },
    clear(){ M = []; drawMarks(); over.selectAll('*').remove(); if (inset) inset.iover.selectAll('*').remove(); areaEl.forEach(list => list.forEach(el => el.classList.remove('target', 'hit', 'reveal', 'wrong'))); },
    mark(m){ M.push(m); drawMarks(); },
    mark2(list){ M.push(...list); drawMarks(); },
    line(a, b){
      const ls = {type:'LineString', coordinates:[a, b]};
      over.append('path').attr('class', 'gline').attr('d', path(ls));
      if (inset) inset.iover.append('path').attr('class', 'gline').attr('d', inset.ipath(ls));
    },
    area(key, cls){ (areaEl.get(key) || []).forEach(el => { el.classList.add(cls); el.parentNode.appendChild(el); }); },
    featureBounds(f){ return path.bounds(f); },
    boundsLL,
    zoomToBounds,
    zoomFeature(f, ctx = 3, mk = 14){
      const b = path.bounds(f);
      const wide = (b[1][0] - b[0][0]) > W * 0.6;
      if (wide){ this.reset(); return; }
      zoomToBounds(b, mk, 750, ctx);
    },
    isTiny(f){ const b = path.bounds(f); return (b[1][0] - b[0][0]) * T.k < 14 && (b[1][1] - b[0][1]) * T.k < 14; },
    tinyAfter(f, k){ const b = path.bounds(f); return Math.max(b[1][0] - b[0][0], b[1][1] - b[0][1]) * k < 16; },
    reset(dur = 500){ if (REDUCED || !dur) svg.call(zoom.transform, d3.zoomIdentity); else svg.transition().duration(dur).call(zoom.transform, d3.zoomIdentity); },
    zoomBy(f){ svg.transition().duration(250).call(zoom.scaleBy, f); },
    k(){ return T.k; },
    screenPt,
    projectScreen(ll){ const p = proj(ll); return p ? this.screenPt(T.apply(p)) : null; }
  };
}

/* Globe en rotation (canvas) */
function startGlobe(canvas){
  if (GLOBE) GLOBE.stop();
  if (!canvas) return;
  let raf = 0, alive = true, rot = [-8, -28], drag = null, last = performance.now();
  const ctx = canvas.getContext('2d');
  const proj = d3.geoOrthographic().clipAngle(90).precision(.6);
  const path = d3.geoPath(proj, ctx);
  const grat = d3.geoGraticule10();
  function frame(now){
    if (!alive) return;
    const dt = Math.min(50, now - last); last = now;
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(10, Math.round(r.width * dpr)), h = Math.max(10, Math.round(r.height * dpr));
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    const R = Math.min(w, h) * 0.40, cx = w / 2, cy = h / 2;
    if (!drag && !REDUCED) rot[0] += dt * 0.012;
    proj.scale(R).translate([cx, cy]).rotate(rot);
    ctx.clearRect(0, 0, w, h);
    // halo
    let g = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.35);
    g.addColorStop(0, 'rgba(79,216,255,.34)'); g.addColorStop(1, 'rgba(79,216,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.35, 0, 2 * Math.PI); ctx.fill();
    // océan
    g = ctx.createRadialGradient(cx - R * .35, cy - R * .4, R * .1, cx, cy, R);
    g.addColorStop(0, '#1f5aa6'); g.addColorStop(1, '#061733');
    ctx.fillStyle = g; ctx.beginPath(); path({type:'Sphere'}); ctx.fill();
    ctx.strokeStyle = 'rgba(243,238,227,.08)'; ctx.lineWidth = dpr; ctx.beginPath(); path(grat); ctx.stroke();
    if (GEO.land){
      ctx.fillStyle = '#f2e5c6'; ctx.beginPath(); path(GEO.land); ctx.fill();
      ctx.strokeStyle = 'rgba(120,98,60,.7)'; ctx.lineWidth = .8 * dpr; ctx.stroke();
    }
    // ombre de terminateur
    g = ctx.createRadialGradient(cx - R * .3, cy - R * .35, R * .2, cx, cy, R * 1.02);
    g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(3,8,20,.55)');
    ctx.fillStyle = g; ctx.beginPath(); path({type:'Sphere'}); ctx.fill();
    // épingles
    const center = [-rot[0], -rot[1]];
    CAPITAL_DOTS.forEach((ll, i) => {
      if (d3.geoDistance(ll, center) > Math.PI / 2 - .08) return;
      const [x, y] = proj(ll);
      const ph = ((now / 1400) + i * .37) % 1;
      ctx.beginPath(); ctx.arc(x, y, (4 + ph * 16) * dpr, 0, 2 * Math.PI);
      ctx.strokeStyle = `rgba(255,106,77,${(1 - ph) * .8})`; ctx.lineWidth = 1.5 * dpr; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 3.6 * dpr, 0, 2 * Math.PI); ctx.fillStyle = '#ff6a4d'; ctx.fill();
      ctx.lineWidth = 1.4 * dpr; ctx.strokeStyle = '#fff'; ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(243,238,227,.25)'; ctx.lineWidth = 1 * dpr; ctx.beginPath(); path({type:'Sphere'}); ctx.stroke();
    raf = requestAnimationFrame(frame);
  }
  canvas.onpointerdown = e => { drag = {x:e.clientX, y:e.clientY, r:rot.slice()}; canvas.setPointerCapture(e.pointerId); };
  canvas.onpointermove = e => { if (!drag) return; rot = [drag.r[0] + (e.clientX - drag.x) * .35, clamp(drag.r[1] - (e.clientY - drag.y) * .35, -70, 70)]; };
  canvas.onpointerup = canvas.onpointercancel = () => { drag = null; };
  raf = requestAnimationFrame(frame);
  landP.then(() => {}).catch(() => {});
  GLOBE = {stop(){ alive = false; cancelAnimationFrame(raf); GLOBE = null; }};
}

let G = null;

const RING_C = 2 * Math.PI * 22;

function buildQuestions(mode, dk){
  const d = DIFF[dk];
  let pool = [];
  if (mode.id === 'regions'){
    pool = GEO.regions.map(r => ({kind:'area', key:r.key, f:r.f, name:r.name, hint:dk === 'facile' ? 'Chef-lieu : ' + r.cap : '', fact:'Chef-lieu : ' + r.cap}));
  } else if (mode.id === 'departements'){
    pool = GEO.deps.filter(x => d.tiers.includes(x.tier)).map(x => {
      const full = x.code ? `${x.name} (${x.code})` : x.name;
      const byNum = dk === 'difficile' && x.code && Math.random() < .5;
      return {kind:'area', dep:true, key:x.key, f:x.f, name:full,
        label:byNum ? 'le n° ' + x.code : dk === 'difficile' ? x.name : full,
        hint:dk === 'facile' ? 'Région : ' + x.region : '', fact:x.region};
    });
  } else if (mode.id === 'villes'){
    pool = CITIES.filter(c => d.tiers.includes(c.tier)).map(c => ({kind:'city', name:c.name, ll:[c.lon, c.lat], hint:dk === 'facile' && c.region ? 'Région : ' + c.region : '', fact:c.region ? c.region : ''}));
  } else {
    const list = COUNTRIES.filter(c => d.tiers.includes(c.tier) && (mode.id !== 'cap-eu' || c.cont === 'EU') && (mode.id === 'cap-eu' || mode.id === 'cap-monde' ? true : !!c.f));
    pool = list.map(c => {
      if (mode.id === 'pays-carte') return {kind:'area', key:c.key, f:c.f, name:c.name, hint:dk === 'facile' ? 'Continent : ' + CONT[c.cont] : '', fact:'Capitale : ' + c.cap};
      const isCap = mode.id !== 'pays-nom';
      const answer = isCap ? c.cap : c.name;
      const answers = [answer, ...(isCap ? c.capAl : c.nameAl)];
      let hint = '';
      if (dk === 'facile') hint = pattern(answer, true) + (isCap ? '' : '  ·  ' + CONT[c.cont]);
      else if (dk === 'moyen') hint = 'Commence par « ' + answer[0].toUpperCase() + ' »';
      return {kind:'typed', key:c.key, f:c.f, name:c.name, answer, answers, hint, fact:isCap ? '' : 'Capitale : ' + c.cap, cont:c.cont};
    });
  }
  return shuffle(pool).slice(0, Math.min(NQ, pool.length));
}

function countdown(){
  return new Promise(res => {
    if (REDUCED) return res();
    const st = $('#stage'); if (!st) return res();
    const el = document.createElement('div'); el.className = 'count'; st.appendChild(el);
    $('#prompt').textContent = 'Prêt ?';
    const seq = ['3', '2', '1', 'Go !'];
    const g0 = G;
    let k = 0;
    const tick = () => {
      if (G !== g0 || VIEW !== 'game' || k >= seq.length){ el.remove(); return res(); }
      el.innerHTML = `<span>${seq[k]}</span>`; sfx(k < 3 ? 'tick' : 'start'); k++;
      setTimeout(tick, k === seq.length ? 420 : 560);
    };
    tick();
  });
}
function stopGame(){ if (G){ cancelAnimationFrame(G.raf); G.answered = true; } G = null; }

  m.clear();
  $('#qn').textContent = G.i + 1;
  document.querySelectorAll('#dots i').forEach((el, k) => el.classList.toggle('cur', k === G.i));
  const prompt = $('#prompt'), hint = $('#hint'), dock = $('#dock');
  hint.textContent = q.hint || '';
  const qc = $('.qcard'); if (qc){ qc.classList.remove('qin'); void qc.offsetWidth; qc.classList.add('qin'); }
  if (mode.type === 'map'){
    prompt.innerHTML = (q.kind === 'city' ? 'Place ' : 'Trouve ') + `<span class="hl">${esc(q.label || q.name)}</span>`;
    m.setClickable(true);
    m.reset(450);
    dock.innerHTML = `<div class="tipbar"><div class="tip glass">Clique sur la carte · molette ou pincement pour zoomer</div><button class="btn skip glass" type="button" data-act="skip" title="Échap">Suivant ›</button></div>`;
    G.limit = d.tMap;
  } else {
    prompt.innerHTML = mode.id === 'pays-nom' ? 'Quel est ce pays ?' : `Capitale de <span class="hl">${esc(q.name)}</span> ?`;
    m.setClickable(false);
    if (q.f){
      m.area(q.key, 'target');
      if (mode.view === 'europe'){
        const eb = m.boundsLL([[-24, 35], [44, 35], [-24, 70], [44, 70], [10, 71], [10, 34]]);
        const fb = m.featureBounds(q.f);
        const inside = fb[0][0] >= eb[0][0] - 5 && fb[1][0] <= eb[1][0] + 5 && fb[0][1] >= eb[0][1] - 5 && fb[1][1] <= eb[1][1] + 5;
        m.zoomToBounds(inside ? eb : [[Math.min(eb[0][0], fb[0][0]), Math.min(eb[0][1], fb[0][1])], [Math.max(eb[1][0], fb[1][0]), Math.max(eb[1][1], fb[1][1])]], 8, 650);
        setTimeout(() => { if (G && !G.answered && q === G.qs[G.i] && m.isTiny(q.f)) m.mark({type:'ring', ll:d3.geoCentroid(q.f), r:20}); }, 700);
      } else {
        m.zoomFeature(q.f, 3.2, 14);
        setTimeout(() => { if (G && !G.answered && q === G.qs[G.i] && m.isTiny(q.f)) m.mark({type:'ring', ll:d3.geoCentroid(q.f), r:20}); }, 800);
      }
    } else m.reset(400);
    const maxTries = 3;
    dock.innerHTML = `<form class="ansform glass" id="ansform" autocomplete="off">
      <input id="ans" type="text" placeholder="${mode.id === 'pays-nom' ? 'Nom du pays…' : 'Nom de la capitale…'}" aria-label="Ta réponse" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <span class="tries" id="tries">${maxTries} essais</span>
      <button class="btn primary" type="submit">Valider</button>
      <button class="btn skip" type="button" data-act="skip" id="skipBtn" title="Échap">Suivant ›</button></form>`;
    const inp = $('#ans');
    inp.addEventListener('input', () => { if (!G.answered && exactMatch(inp.value, q.answers)) typedCorrect(); });
    $('#ansform').addEventListener('submit', e => {
      e.preventDefault();
      if (G.answered) return;
      const v = inp.value.trim(); if (!v) return;
      if (fuzzyMatch(v, q.answers)) typedCorrect(); else typedWrong(v);
    });
    setTimeout(() => { const a = document.activeElement; if (!(a && a.closest && a.closest('#chat'))) inp.focus({preventScroll:true}); }, 30);
    G.limit = d.tType;
  }
  startTimer(mode.type === 'map' ? 350 : 650);
  pushPresence();
}

function startTimer(delay = 0){
  cancelAnimationFrame(G.raf);
  G.t0 = performance.now() + (REDUCED ? 0 : delay);
  const fg = $('#trfg'), sec = $('#tsec'), ring = $('#tring');
  const loop = () => {
    if (!G || G.answered) return;
    const left = Math.min(G.limit, Math.max(0, G.limit - (performance.now() - G.t0) / 1000));
    fg.style.strokeDashoffset = (RING_C * (1 - left / G.limit)).toFixed(2);
    const s = Math.ceil(left);
    sec.textContent = s;
    ring.classList.toggle('low', left <= 3);
    const stg = $('#stage'); if (stg) stg.classList.toggle('danger', left <= 3 && left > 0);
    if (left <= 3 && s !== G.lastTick && s > 0){ G.lastTick = s; sfx('tick'); }
    if (left <= 0){ onTimeout(); return; }
    G.raf = requestAnimationFrame(loop);
  };
  loop();
}
const speedNow = () => G ? clamp(1 - ((performance.now() - G.t0) / 1000) / G.limit, 0, 1) : 0;
const elapsed = () => G ? Math.max(0, (performance.now() - G.t0) / 1000) : 0;

function onPick(ll, pt, sp){
  if (!G || G.answered) return;
  const q = G.qs[G.i], d = DIFF[G.dk], m = G.map, S = speedNow(), sec = elapsed();
  let P, hit, dist = 0, detail, title;
  m.setClickable(false);
  if (q.kind === 'city'){
    dist = d3.geoDistance(ll, q.ll) * R_EARTH;
    P = Math.exp(-dist / d.cityK);
    hit = dist <= d.cityHit;
    m.line(ll, q.ll);
    m.mark2([{type:'pin', ll:q.ll, cls:'pin-true', label:q.name}, {type:'pin', ll, cls:'pin-you'}, {type:'label', ll:d3.geoInterpolate(ll, q.ll)(.5), label:fmt(dist) + ' km'}]);
    title = hit ? (dist < 10 ? 'Dans le mille !' : 'Bien placé !') : P > .05 ? 'Pas loin…' : 'Raté';
    detail = `Ton épingle est à <b>${fmt(dist)} km</b> de ${esc(q.name)}${q.fact ? ' <span class="muted">(' + esc(q.fact) + ')</span>' : ''}.`;
  } else {
    const inside = d3.geoContains(q.f, ll);
    const isWorld = G.mode.view !== 'france';
    let near = null;
    if (inside){ P = 1; hit = true; }
    else {
      const n = nearestOnFeature(q.f, ll); dist = n.d; near = n.pt;
      const tol = isWorld ? 25 : q.dep ? 4 : 0;
      if (dist <= tol){ P = 1; hit = true; }
      else { P = Math.max(0, 1 - dist / (isWorld ? d.areaD.w : q.dep ? d.areaD.dep : d.areaD.fr)); hit = false; }
    }
    m.area(q.key, hit ? 'hit' : 'reveal');
    let clicked = null;
    if (!hit){
      const frItems = q.dep ? GEO.deps : GEO.regions;
      const src = isWorld ? GEO.world : frItems.map(r => r.f);
      clicked = src.find(f => d3.geoContains(f, ll)) || null;
      if (clicked) m.area(clicked.k, 'wrong');
      if (near){ m.line(ll, near); m.mark({type:'label', ll:d3.geoInterpolate(ll, near)(.5), label:fmt(dist) + ' km'}); }
    }
    m.mark({type:'pin', ll, cls:hit ? 'pin-true' : 'pin-you'});
    const clickedName = clicked ? (isWorld ? ((countryByKey.get(clicked.k) || {}).name || clicked.properties.name) : (frItems.find(r => r.key === clicked.k) || {}).name) : null;
    title = hit ? 'Dans le mille !' : P > 0 ? 'Presque…' : 'Raté';
    detail = hit
      ? `C’est bien <b>${esc(q.name)}</b>. <span class="muted">${esc(q.fact || '')}</span>`
      : `${clickedName ? 'Tu as cliqué sur ' + esc(clickedName) + '. ' : ''}<b>${esc(q.name)}</b> était à ${fmt(dist)} km.`;
    if (isWorld){
      const fb = m.featureBounds(q.f), p = m.proj(ll);
      if (p && (fb[1][0] - fb[0][0]) < m.W * .6){
        m.zoomToBounds([[Math.min(fb[0][0], p[0]), Math.min(fb[0][1], p[1])], [Math.max(fb[1][0], p[0]), Math.max(fb[1][1], p[1])]], 10, 800, 1.5);
      }
    }
  }
  finish({P, hit, S, sec, title, detail, sp, short:q.kind === 'city' ? fmt(dist) + ' km' : hit ? 'Trouvé' : fmt(dist) + ' km'});
}

function typedCorrect(){
  const q = G.qs[G.i], S = speedNow(), sec = elapsed();
  G.map.area(q.key, 'hit');
  const P = 1 - 0.25 * G.attempts;
  finish({P, hit:true, S, sec, title:sec < 3 ? 'Éclair !' : 'Exact !', detail:`<b>${esc(q.answer)}</b>${q.fact ? ' · <span class="muted">' + esc(q.fact) + '</span>' : ''}${G.attempts ? ' · ' + G.attempts + ' erreur' + (G.attempts > 1 ? 's' : '') : ''}`, short:'Trouvé'});
}
function typedWrong(v){
  G.attempts++;
  const q = G.qs[G.i];
  if (G.attempts >= 3){
    G.map.area(q.key, 'reveal');
    finish({P:0, hit:false, S:0, sec:elapsed(), title:'Raté', detail:`La réponse était <b>${esc(q.answer)}</b>. Tu as écrit « ${esc(v)} ».`, short:'Raté'});
    return;
  }
  sfx('bad');
  const f = $('#ansform'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  const t = $('#tries'); t.textContent = (3 - G.attempts) + (3 - G.attempts > 1 ? ' essais' : ' essai'); t.classList.add('warn');
  const inp = $('#ans'); inp.select();
  const sk = $('#skipBtn'); if (sk) sk.classList.add('hot');
  fxMini('miss');
}
function skipTyped(){
  if (!G || G.answered) return;
  const q = G.qs[G.i], m = G.map;
  m.setClickable(false);
  if (q.kind === 'city') m.mark({type:'pin', ll:q.ll, cls:'pin-true', label:q.name});
  else if (q.f){ m.area(q.key, 'reveal'); if (G.mode.type === 'map' && G.mode.view !== 'france') m.zoomFeature(q.f, 3, 8); }
  const ans = q.kind === 'typed' ? q.answer : q.name;
  finish({P:0, hit:false, S:0, sec:elapsed(), skip:true, title:'Passé', detail:`La réponse était <b>${esc(ans)}</b>.`, short:'Passé'});
}
function onTimeout(){
  if (!G || G.answered) return;
  const q = G.qs[G.i], m = G.map;
  m.setClickable(false);
  if (q.kind === 'city'){ m.mark({type:'pin', ll:q.ll, cls:'pin-true', label:q.name}); }
  else if (q.f){ m.area(q.key, 'reveal'); if (G.mode.type === 'map' && G.mode.view !== 'france') m.zoomFeature(q.f, 3, 8); }
  const ans = q.kind === 'typed' ? q.answer : q.name;
  finish({P:0, hit:false, S:0, sec:G.limit, timeout:true, title:'Temps écoulé', detail:`La réponse était <b>${esc(ans)}</b>.`, short:'Temps'});
}

function fxMini(kind){
  const st = $('#stage'); if (!st || REDUCED) return;
  const f = document.createElement('div'); f.className = 'flash ' + kind; st.appendChild(f); setTimeout(() => f.remove(), 650);
  if (kind === 'miss'){ st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }
}
function fx(kind, sp, label, streak){
  const st = $('#stage'); if (!st) return;
  const sr = st.getBoundingClientRect();
  const j = document.createElement('div'); j.className = 'judge ' + kind; j.textContent = label; st.appendChild(j); setTimeout(() => j.remove(), 1200);
  if (REDUCED) return;
  fxMini(kind);
  if (kind !== 'miss'){
    const x = sp ? sp.x - sr.left : sr.width / 2, y = sp ? sp.y - sr.top : sr.height / 2;
    const cols = kind === 'hit' ? ['#3ee0a8', '#9effd9', '#4fd8ff', '#ffd166'] : ['#ffd166', '#ffb547', '#fff1b8'];
    const ring = document.createElement('div'); ring.className = 'ring-fx'; ring.style.cssText = `left:${x}px;top:${y}px;--c:${cols[0]}`; st.appendChild(ring); setTimeout(() => ring.remove(), 650);
    const n = kind === 'hit' ? 22 : 12;
    for (let k = 0; k < n; k++){
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 90;
      const sp2 = document.createElement('i'); sp2.className = 'spark';
      sp2.style.cssText = `left:${x}px;top:${y}px;--c:${cols[k % cols.length]};--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px`;
      st.appendChild(sp2); setTimeout(() => sp2.remove(), 800);
    }
  }
  if (streak >= 3){
    const c = document.createElement('div'); c.className = 'combo'; c.textContent = `COMBO ×${streak} · +${Math.min(streak, 5) * 10} %`;
    st.appendChild(c); setTimeout(() => c.remove(), 1450); sfx('combo');
  }
}
function finish(r){
  if (!G || G.answered) return;
  G.answered = true;
  cancelAnimationFrame(G.raf);
  $('#tring').classList.remove('low');
  const F = 0.3 + 0.7 * r.S;
  const B = r.hit ? 1 + 0.1 * Math.min(G.streak, 5) : 1;
  const pts = r.timeout ? 0 : Math.round(1000 * r.P * F * B);
  G.streak = r.hit ? G.streak + 1 : 0;
  G.maxStreak = Math.max(G.maxStreak, G.streak);
  if (r.hit) G.hits++;
  G.raw += pts;
  pushPresence();
  const cls = r.hit ? 'hit' : pts > 0 ? 'part' : 'miss';
  const q = G.qs[G.i];
  G.log.push({name:q.kind === 'typed' && G.mode.id !== 'pays-nom' ? q.name + ' → ' + q.answer : q.name, cls, pts, sec:r.sec, short:r.short, timeout:!!r.timeout});
  sfx(cls === 'hit' ? 'good' : cls === 'part' ? 'part' : 'bad');
  const label = r.skip ? 'PASSÉ' : r.timeout ? 'TROP TARD !' : cls === 'miss' ? 'RATÉ !' : cls === 'part' ? (r.P > .6 ? 'PRESQUE !' : 'PAS LOIN') : r.S >= .8 ? 'PARFAIT !' : r.S >= .55 ? 'EXCELLENT !' : 'BIEN JOUÉ';
  fx(cls, r.sp || null, label, cls === 'hit' ? G.streak : 0);
  const stg = $('#stage'); if (stg) stg.classList.remove('danger');
  const scEl = $('#score'); if (scEl){ scEl.classList.remove('bump'); void scEl.offsetWidth; scEl.classList.add('bump'); }
  // tableau de bord
  countTo($('#score'), G.raw - pts, G.raw, 600);
  const dots = document.querySelectorAll('#dots i'); if (dots[G.i]){ dots[G.i].classList.remove('cur'); dots[G.i].classList.add(cls); }
  const st = $('#streak');
  st.classList.toggle('on', G.streak >= 2);
  st.innerHTML = G.streak >= 2
    ? `<svg viewBox="0 0 24 24" fill="#ff7a4d"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg> Série ×${G.streak} · +${Math.min(G.streak, 5) * 10} %`
    : 'Pas de série';
  // points flottants
  const sp = r.sp || null;
  const stage = $('#stage');
  if (stage){
    const sr = stage.getBoundingClientRect();
    const x = sp ? sp.x - sr.left : sr.width / 2, y = sp ? sp.y - sr.top - 30 : sr.height * .45;
    const el = document.createElement('div');
    el.className = 'pop' + (pts ? '' : ' zero');
    el.style.left = clamp(x, 40, sr.width - 40) + 'px'; el.style.top = clamp(y, 60, sr.height - 10) + 'px';
    el.textContent = pts ? '+' + fmt(pts) : '0';
    $('#popups').appendChild(el); setTimeout(() => el.remove(), 1400);
  }
  const last = G.i + 1 >= G.qs.length;
  const brk = pts ? `précision ${Math.round(r.P * 100)} % · vitesse ${Math.round(F * 100)} %${B > 1 ? ' · série +' + Math.round((B - 1) * 100) + ' %' : ''} · ${fmt1(r.sec)} s` : r.timeout ? 'aucun point' : 'aucun point · la série repart de zéro';
  $('#dock').innerHTML = `<div class="res glass ${cls}">
    <div class="res-main"><p class="res-title">${esc(r.title)}</p><p class="res-detail">${r.detail}</p><p class="res-break">${brk}</p></div>
    <div class="res-pts">+${fmt(pts)}</div>
    <button class="btn primary" data-act="next" id="nextBtn">${last ? 'Voir mon rang' : 'Suivante'} <kbd>↵</kbd></button></div>`;
  setTimeout(() => { const a = document.activeElement; const b = $('#nextBtn'); if (b && !(a && a.closest && a.closest('#chat'))) b.focus({preventScroll:true}); }, 50);
}
function nextQuestion(){
  if (!G || !G.answered) return;
  G.i++;
  if (G.i >= G.qs.length) renderEnd();
  else showQuestion();
}
function countTo(el, from, to, dur){
  if (!el) return;
  if (REDUCED){ el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
